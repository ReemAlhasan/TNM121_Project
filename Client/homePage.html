<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Higher Lower Game</title>
    <link rel="styleSheet" href="styleSheet.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div class="homePageAbout"> <!-- Upper section of main page, logo, about us menu button and short text about game-->
        <button class="HighContrastButton" id="contrastBtn" onclick="toggleHighContrast()">High Contrast</button>
        <button class="AboutUsButton"><a href="aboutUsPage.html">About Us</a></button>
        <img class="logo" src="BigHL.png" alt="Higher Lower Logo"> <!-- Logo image pathway-->
        <h1>Higher Lower Game</h1>
        <p class="hpGameInfo">Welcome to the hardest quiz of your life</p>

    </div>
    
    <!--Start game button-->
    <div class="startGameButtonContainer">
        <button id="startGame" class="startGameButton">Start Game</button>
    </div>

    <!--Settings section-->
    <div class="menu-container"> <!-- Settings section of the main page-->
        <h2>Settings</h2>
        <p>Please choose your preferred settings that you want to be shown:</p>
        
        <div class="enableSettingsContainer"> <!--Setting options-->
            <span class="enableSettingsText1">Image</span>
            <div class ="enableSettingsButton1"> <!--Toggle switch for image to be shown-->
                <label class="switch">
                    <input type="checkbox" id="imageShown">
                    <span class="slider"></span>
                </label>
            </div>
            
            <span class="enableSettingsText2">Genre</span>
            <div class ="enableSettingsButton2"> <!--Toggle switch for genre to be shown-->
                <label class="switch">
                    <input type="checkbox" id="genreShown">
                    <span class="slider"></span>
                </label>
            </div>

            <span class="enableSettingsText3">Certificate</span>
            <div class ="enableSettingsButton3"> <!--Toggle switch for certificate to be shown-->
                <label class="switch">
                    <input type="checkbox" id="certificateShown">
                    <span class="slider"></span>
                </label>
            </div>

            <span class="enableSettingsText1">Director</span>
            <div class ="enableSettingsButton1"> <!--Toggle switch for director to be shown-->
                <label class="switch">
                    <input type="checkbox" id="directorShown">
                    <span class="slider"></span>
                </label>
            </div>
           
            <span class="enableSettingsText2">Description</span>
            <div class ="enableSettingsButton2"> <!--Toggle switch for description to be shown-->
                <label class="switch">
                    <input type="checkbox" id="descriptionShown">
                    <span class="slider"></span>
                </label>
            </div>
            
            <span class="enableSettingsText3">Release Year</span>
            <div class ="enableSettingsButton3"> <!--Toggle switch for release year to be shown-->
                <label class="switch">
                    <input type="checkbox" id="releaseYearShown">
                    <span class="slider"></span>
                </label>
            </div>
            

        </div>
        
        <h3>Advanced Settings</h3>
        <div class="advancedSettingsContainer">
            <div class="genreSelect"><!--Select genre-->
                <label for="genre">Select Genre</label>
                <select id="genre">
                    <option value="">--Choose Genre--</option>
                    <option value="action">Action</option>
                    <option value="comedy">Comedy</option>
                    <option value="drama">Drama</option>
                    <option value="horror">Horror</option>
                </select>
            </div>

            <div class="ageSelect"><!--Select certificate-->
                <label for="certificate">Select Certificate</label>
                <select id="certificate">
                    <option value="">--Choose Certificate--</option>
                    <option value="All">Movies approved for all ages</option>
                    <option value="7+">Movies for children 7 and older</option>
                    <option value="13+">Movies for teens 13 and older</option>
                    <option value="15+">Movies for teens 15 and older</option>
                    <option value="18+">Movies for people 18 and older</option>
                </select>
            </div>
        </div>
        
    
    <div class="filter-item">
        <div class="filter-label">
            Release year:
            <span id="yearRangeValue" class="value-pill" aria-live="polite">1980–2020</span>
        </div>
    
        <div class="dual-range" data-kind="year">
            <div class="range-rail"></div>
            <div class="range-highlight" id="yearHighlight"></div>
        
            <input
            type="range"
            id="yearMin"
            class="filter-range dual-handle"
            min="1960"
            max="2026"
            step="1"
            value="1960"
            aria-label="Minimum release year"
            />
            <input
            type="range"
            id="yearMax"
            class="filter-range dual-handle"
            min="1960"
            max="2026"
            step="1"
            value="2026"
            aria-label="Maximum release year"
            />
        </div>
    
        <div class="range-scale">
            <span>1960</span><span>1990</span><span>2026</span>
        </div>
    </div>


    <div class="filter-item">
        <div class="filter-label">
            Runtime (min):
            <span id="runtimeRangeValue" class="value-pill" aria-live="polite">0–240</span>
        </div>
    
        <div class="dual-range" data-kind="runtime">
            <div class="range-rail"></div>
            <div class="range-highlight" id="runtimeHighlight"></div>
        
            <input
            type="range"
            id="runtimeMin"
            class="filter-range dual-handle"
            min="0"
            max="500"
            step="1"
            value="0"
            aria-label="Minimum runtime in minutes"
            />
            <input
            type="range"
            id="runtimeMax"
            class="filter-range dual-handle"
            min="0"
            max="500"
            step="1"
            value="500"
            aria-label="Maximum runtime in minutes"
            />
        </div>
    
        <div class="range-scale">
            <span>0</span><span>250</span><span>500</span>
        </div>
    </div>
    </div>
</body>

<script src="script.js"></script>
</html>
